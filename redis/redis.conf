# Stream-backed pub/sub cache (dev-friendly defaults)

bind 0.0.0.0
port 6379
protected-mode no

# Persistence — streams survive restarts
appendonly yes
appendfsync everysec
dir /data

# Cap memory in local dev; trim oldest stream entries when full
maxmemory 256mb
maxmemory-policy allkeys-lru

# Optional: auto-trim stream keys after N entries (per-key via XADD MAXLEN in app)
# Uncomment to set a global default for new streams:
# stream-node-max-entries 10000
